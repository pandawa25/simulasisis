<!--TITLE_BLOCK-->
<meta name="claude:viewport-fit-sides" content="cover">
<style>
<!--SHARED_TOKENS-->
*{box-sizing:border-box}
:root{ --r-lg:16px; --r-md:12px; --shadow:0 1px 2px rgba(16,24,38,.05), 0 4px 14px rgba(16,24,38,.05); --shadow-hover:0 2px 4px rgba(16,24,38,.06), 0 10px 26px rgba(16,24,38,.10); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);} }
:root[data-theme="dark"]{ --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45); }
body{
  background:var(--bg); color:var(--fg); font-family:var(--disp); margin:0;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:20; background:var(--panel); }
h1,h2,h3{font-family:var(--disp); text-wrap:balance; margin:0}
.app{max-width:1240px; margin:0 auto; padding-bottom:56px}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  margin:12px 0 0; padding:14px 18px; display:flex; align-items:center; gap:14px;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.brand-mark{
  width:42px; height:42px; flex:none; border-radius:12px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-fg);
}
.brand-mark svg{width:24px; height:24px}
.brand-text{min-width:0; flex:1}
.topbar h1{font-size:1.18rem; font-weight:700; letter-spacing:-.005em; line-height:1.25}
.topbar .sub{display:flex; gap:8px; align-items:center; margin-top:3px; font-size:.74rem; color:var(--fg-dim); flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:.68rem; padding:2px 8px; border-radius:20px; background:var(--panel-2); border:1px solid var(--border); color:var(--fg-dim)}
.icon-btn{
  width:42px; height:42px; flex:none; border-radius:12px; cursor:pointer; display:grid; place-items:center;
  border:1px solid var(--border); background:var(--panel-2); color:var(--fg);
  transition:border-color .15s, background .15s;
}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.icon-btn svg{width:20px; height:20px}
.icon-btn .i-sun{display:none}
:root[data-eff="dark"] .icon-btn .i-sun{display:block}
:root[data-eff="dark"] .icon-btn .i-moon{display:none}

/* ---------- tab unit ---------- */
.tabs-wrap{margin-top:18px}
.tabs{
  display:flex; gap:6px; padding:5px; overflow-x:auto; scrollbar-width:thin;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-md);
}
.tab{
  flex:none; font-family:var(--disp); font-size:.84rem; font-weight:600; cursor:pointer;
  padding:9px 16px; border-radius:9px; border:0; background:transparent; color:var(--fg-dim);
  white-space:nowrap; transition:background .15s, color .15s;
}
.tab:hover{background:var(--panel-2); color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-fg)}
.tab[aria-disabled="true"]{cursor:not-allowed; opacity:.55}
.tab[aria-disabled="true"]:hover{background:transparent; color:var(--fg-dim)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.tip{
  position:fixed; z-index:50; pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity .12s, transform .12s;
  background:var(--fg); color:var(--bg); font-size:.74rem; font-weight:600; padding:6px 10px; border-radius:8px;
  white-space:nowrap;
}
.tip.show{opacity:1; transform:none}

/* ---------- toolbar ---------- */
.section-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:22px 2px 0}
.section-head h2{font-size:1.02rem; font-weight:700}
.section-head .count{font-size:.76rem; color:var(--fg-dim)}
.section-head .spacer{flex:1}
.search-wrap{position:relative; flex:0 1 360px; min-width:200px; width:100%; max-width:360px}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--fg-dim); pointer-events:none}
.search{
  width:100%; font-family:var(--disp); font-size:.86rem; padding:10px 12px 10px 36px;
  border:1px solid var(--border); border-radius:var(--r-md); background:var(--panel); color:var(--fg);
}
.search:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.status-legend{display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:.72rem; color:var(--fg-dim); padding:12px 2px 0}
.status-legend .sw{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:0}

/* ---------- kartu ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px;
  padding:16px 0 4px;
}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px;
  display:flex; flex-direction:column; gap:10px; color:inherit; box-shadow:var(--shadow);
  transition:box-shadow .15s, transform .12s, border-color .15s;
}
.card.done:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px)}
.card.pending{opacity:.55; box-shadow:none; background:var(--panel-2)}
.card.st-normal{border-color:var(--false)}
.card.st-trip{border-color:var(--true)}
.sheet-no{font-family:var(--mono); font-size:.68rem; color:var(--fg-dim); letter-spacing:.05em; text-transform:uppercase}
.card-tag{font-family:var(--mono); font-size:1rem; font-weight:650; line-height:1.3}
.card-note{font-size:.76rem; color:var(--fg-dim)}
.card-state{
  align-self:flex-start; display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:.66rem;
  font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:20px;
  background:var(--panel-2); color:var(--fg-dim);
}
.stat-shape{width:8px; height:8px; border-radius:50%; background:var(--neutral-fg); flex:none}
.card.st-normal .card-state{background:var(--false-bg); color:var(--false)}
.card.st-normal .stat-shape{background:var(--false)}
.card.st-trip .card-state{background:var(--true-bg); color:var(--true)}
.card.st-trip .stat-shape{background:var(--true)}
.card-actions{display:flex; gap:8px; margin-top:auto; padding-top:4px; flex-wrap:wrap}
.card-action-btn{
  flex:1 1 auto; text-align:center; font-size:.76rem; font-weight:650; text-decoration:none;
  color:var(--accent-fg); background:var(--accent); border:1px solid var(--accent); border-radius:10px;
  padding:8px 10px; white-space:nowrap; transition:opacity .15s;
}
.card-action-btn.secondary{color:var(--fg); background:var(--panel-2); border-color:var(--border)}
.card-action-btn:hover{opacity:.88}
.card-action-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.empty{padding:48px 4px; text-align:center; color:var(--fg-dim); font-size:.88rem}
@media (max-width:560px){
  .topbar{padding:12px; gap:10px}
  .topbar h1{font-size:1rem}
  .brand-mark{width:36px; height:36px}
}
</style>
<!--TITLE_TAG-->

<div class="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-3z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
    </div>
    <div class="brand-text">
      <h1>Portal Simulator Logic Safety Instrumented System (SIS)</h1>
      <div class="sub"><span id="docTitle"></span><span class="chip" id="docVersion"></span></div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="tabs-wrap">
    <div class="tabs" id="unitTabs" role="tablist" aria-label="Pilih unit"></div>
  </div>

  <div class="section-head">
    <h2 id="unitHeading">Unit 105</h2>
    <span class="count" id="unitCount"></span>
    <span class="spacer"></span>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search" id="searchBox" type="search" placeholder="Cari sheet atau tag UC (mis. 009)…" aria-label="Cari nama sheet atau tag UC">
    </label>
  </div>

  <div class="status-legend">
    <span><span class="sw" style="background:var(--false)"></span>Normal (semua output energized)</span>
    <span><span class="sw" style="background:var(--true)"></span>Trip (ada output yang jatuh)</span>
    <span id="statusHint" class="navhint"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none">Tidak ada sheet yang cocok dengan pencarian.</div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* ======================= sim-engine.js (inline) ======================= */
<!--ENGINE_JS-->
/* ======================= hubungan & status antar sheet (inline) ======================= */
<!--CROSSLINK_JS-->
/* ======================= netlist ringkas tiap sheet selesai (inline) ======================= */
const NETLISTS = <!--NETLISTS_JSON-->;
const TagSync = { KEY: 'sis-sim-tags' };

const DATA = <!--SHEETS_JSON-->;

document.getElementById('docTitle').textContent = DATA.docTitle || '';
document.getElementById('docVersion').textContent = DATA.docVersion || '';

/* ======================= tab unit ======================= */
const UNITS = [
  {id:'105', label:'Unit 105', active:true}, {id:'106', label:'Unit 106'}, {id:'107', label:'Unit 107'},
  {id:'108', label:'Unit 108'}, {id:'148', label:'Unit 148'}, {id:'47', label:'Unit 47'},
  {id:'120', label:'Unit 120'}, {id:'140', label:'Unit 140'}, {id:'180', label:'Unit 180'},
  {id:'100', label:'Unit 100'}, {id:'166', label:'Unit 166'}
];
(function(){
  const tabs = document.getElementById('unitTabs');
  const tip = document.getElementById('tip');
  UNITS.forEach(function(u){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = u.label;
    b.setAttribute('aria-selected', u.active ? 'true' : 'false');
    if(!u.active){
      b.setAttribute('aria-disabled', 'true');
      b.setAttribute('aria-label', u.label + ' — Coming Soon');
      const show = function(){
        tip.textContent = 'Coming Soon';
        const r = b.getBoundingClientRect();
        tip.classList.add('show');
        tip.style.left = Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2) + 'px';
        tip.style.top = (r.bottom + 8) + 'px';
      };
      const hide = function(){ tip.classList.remove('show'); };
      b.addEventListener('mouseenter', show); b.addEventListener('mouseleave', hide);
      b.addEventListener('focus', show); b.addEventListener('blur', hide);
      b.addEventListener('click', function(e){ e.preventDefault(); show(); });
      tabs.addEventListener('scroll', hide, {passive:true});
    }
    tabs.appendChild(b);
  });
})();

/* ======================= theme toggle (ikon matahari/bulan) ======================= */
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('themeBtn');
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effective(){
    const t = root.getAttribute('data-theme');
    if(t === 'dark' || t === 'light') return t;
    return (mq && mq.matches) ? 'dark' : 'light';
  }
  function paint(){ root.setAttribute('data-eff', effective()); }
  let saved = '';
  try{ saved = localStorage.getItem('sis-portal-theme') || ''; }catch(e){}
  if(saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  paint();
  if(mq && mq.addEventListener) mq.addEventListener('change', paint);
  btn.addEventListener('click', function(){
    const next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('sis-portal-theme', next); }catch(e){}
    paint();
  });
})();

/* ======================= render grid ======================= */
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('emptyMsg');
const searchBox = document.getElementById('searchBox');

function matches(item, q){
  if(!q) return true;
  const hay = (String(item.sheet) + ' ' + item.tag + ' ' + (item.note || '')).toLowerCase();
  return hay.indexOf(q.toLowerCase()) !== -1;
}

function render(){
  const q = searchBox.value.trim();
  grid.innerHTML = '';
  let shown = 0;
  DATA.sheets.forEach(function(item){
    if(!matches(item, q)) return;
    shown++;
    const isDone = item.status === 'done';
    const tag = document.createElement('div');
    tag.className = 'card ' + item.status + (isDone && liveStatus[item.slug] ? ' st-' + liveStatus[item.slug].state : '');
    const sheetLabel = 'Sheet ' + String(item.sheet).padStart(3, '0');
    tag.innerHTML =
      '<span class="sheet-no">' + sheetLabel + '</span>' +
      '<div class="card-tag">' + item.tag + '</div>' +
      (isDone ? '<div class="card-state"><span class="stat-shape"></span><span class="st-text">—</span></div>' : '') +
      (item.note ? '<div class="card-note">' + item.note + '</div>' : '') +
      (isDone ?
        '<div class="card-actions">' +
          '<a class="card-action-btn" href="' + item.url + '">Logic Detail →</a>' +
          (item.ceUrl ? '<a class="card-action-btn secondary" href="' + item.ceUrl + '">Cause &amp; Effect →</a>' : '') +
        '</div>' : '');
    if(isDone){
      const ls = liveStatus[item.slug];
      const txt = tag.querySelector('.st-text');
      if(txt) txt.textContent = !ls ? 'STATUS TIDAK TERSEDIA'
        : (ls.state === 'normal' ? 'NORMAL' : 'TRIP — ' + ls.tripped + '/' + ls.total + ' output');
    }
    grid.appendChild(tag);
  });
  emptyMsg.style.display = shown === 0 ? 'block' : 'none';
}

/* ======================= status live tiap sheet =======================
   Portal menghitung ULANG status tiap sheet memakai engine & netlist yang
   sama dgn halaman sheet-nya (netlist ringkas disuntikkan build.js), dari
   state simulasi yang tersimpan: nilai INPUT dari store tag global lintas
   sheet (localStorage 'sis-sim-tags', lihat _tagsync.js) dan memori latch
   RS per sheet (localStorage 'sis-sim-state-<id>'). Jadi angka di sini
   selalu cocok dgn yang tampil di halaman sheet, tanpa menyimpan status
   terpisah yang bisa basi. Berubah otomatis saat tab lain mengubah state. */
const liveStatus = {};
function computeStatus(){
  let tagStore = {};
  try{ tagStore = JSON.parse(localStorage.getItem(TagSync.KEY) || '{}') || {}; }catch(e){}
  Object.keys(NETLISTS).forEach(function(slug){
    const nl = NETLISTS[slug];
    try{
      const sim = SimEngine.createSim(nl);
      const inputState = {};
      Object.keys(nl.nodes).forEach(function(id){
        const n = nl.nodes[id];
        if(n.type !== 'INPUT') return;
        const entry = n.label && tagStore[n.label];
        inputState[id] = entry ? !!entry.v : false;
      });
      try{
        const raw = localStorage.getItem('sis-sim-state-' + (nl.id || slug));
        if(raw){
          const saved = JSON.parse(raw);
          if(saved && saved.rsPrev){
            Object.keys(saved.rsPrev).forEach(function(id){
              if(id in sim.state.rsPrev) sim.state.rsPrev[id] = !!saved.rsPrev[id];
            });
          }
        }
      }catch(e){}
      liveStatus[slug] = SheetStatus.of(nl.nodes, sim.step(inputState));
    }catch(e){ delete liveStatus[slug]; }
  });
}
function syncStatusHint(){
  const nTrip = Object.keys(liveStatus).filter(function(k){ return liveStatus[k].state === 'trip'; }).length;
  const nOk = Object.keys(liveStatus).length - nTrip;
  document.getElementById('statusHint').textContent =
    'Status dihitung ulang di halaman ini dari simulasi yang tersimpan di browser — ' +
    (nTrip ? nTrip + ' sheet sedang trip, ' + nOk + ' normal.' : 'semua sheet selesai dalam kondisi normal.');
}
function refreshStatus(){ computeStatus(); syncStatusHint(); render(); }
window.addEventListener('storage', function(e){
  if(e.key === TagSync.KEY || String(e.key || '').indexOf('sis-sim-state-') === 0) refreshStatus();
});

searchBox.addEventListener('input', render);

document.getElementById('unitCount').textContent = DATA.sheets.length + ' sheet';

computeStatus();
syncStatusHint();
render();
</script>

<meta charset="utf-8">
<title>Portal Simulator Logic Safety Instrumented System (SIS)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ===========================================================
   Shared design tokens — Portal, Logic Detail, Cause & Effect
   SUMBER TUNGGAL. Sebelumnya tiap template (portal/sheet/CE)
   punya :root sendiri yg di-copy-paste terpisah -> gampang
   melenceng diam-diam (contoh nyata: --accent-text yg sempat
   cuma ditambah ke 2 dari 3 template, portal ketinggalan;
   portal juga pakai nama var beda --done/--pending padahal
   secara makna sama dgn --false/--true di 2 template lain).
   Diinjeksikan oleh scripts/build.js lewat placeholder
   <!--SHARED_TOKENS--> ke semua template -- edit warna cukup
   SEKALI DI SINI, jangan edit :root di masing-masing template.
   =========================================================== */
:root{
  --bg:#eef1f5;
  --panel:#ffffff;
  --panel-2:#f6f8fb;
  --fg:#101826;
  --fg-dim:#5b6676;
  --border:#d7dde6;
  --wire:#9aa5b4;

  --accent:#b9770e;       /* dipakai utk border/background/stroke (tombol primary, fokus outline, dll) */
  --accent-fg:#5c3a07;    /* teks DI ATAS background --accent (mis. tombol primary) */
  --accent-text:#935a08;  /* teks aksen DI ATAS background terang (header grup, dsb) -- lebih gelap drpd --accent, supaya kontras >=4.5:1 (WCAG AA) thd bg terang */

  /* status "sehat/normal/selesai" vs "trip/alarm/aktif" -- SATU
     pasangan token dipakai konsisten di semua halaman (sebelumnya
     portal py nama sendiri --done/--pending yg representasi warna
     sama tapi vocab beda dari --false/--true di sheet/CE). */
  --false:#1f8a4c;
  --false-bg:#e4f6ec;
  --true:#c23b2e;
  --true-bg:#fbe6e3;
  --neutral-fg:#8793a6;   /* status netral: "belum dikerjakan" (portal), bukan alarm/trip */
  --neutral-bg:#eef1f5;

  --zone-cause:#eaf1fb;
  --zone-logic:#f3f1ea;
  --zone-effect:#eef7ee;

  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --disp: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f16; --panel:#121826; --panel-2:#171f2e; --fg:#e7ecf3; --fg-dim:#8793a6;
    --border:#263046; --wire:#3c485f;
    --accent:#e3a13a; --accent-fg:#1c1406; --accent-text:#e3a13a;
    --false:#36c17a; --false-bg:#0f2a1b; --true:#f16a5a; --true-bg:#351512;
    --neutral-fg:#5b6676; --neutral-bg:#171f2e;
    --zone-cause:#131c2c; --zone-logic:#1a1710; --zone-effect:#101d14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f16; --panel:#121826; --panel-2:#171f2e; --fg:#e7ecf3; --fg-dim:#8793a6;
  --border:#263046; --wire:#3c485f;
  --accent:#e3a13a; --accent-fg:#1c1406; --accent-text:#e3a13a;
  --false:#36c17a; --false-bg:#0f2a1b; --true:#f16a5a; --true-bg:#351512;
  --neutral-fg:#5b6676; --neutral-bg:#171f2e;
  --zone-cause:#131c2c; --zone-logic:#1a1710; --zone-effect:#101d14;
  color-scheme: dark;
}

*{box-sizing:border-box}
/* Palet portal (indigo-violet) -- hanya untuk halaman ini, token bersama tidak diubah */
:root{ --accent:#4f46e5; --accent-fg:#ffffff; --accent-text:#4338ca; --g1:#4338ca; --g2:#7c3aed; --g3:#0ea5e9; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --btn-bg:#e2e8f0; --btn-bg-hover:#ffffff; --btn-fg:#0f172a; --accent:#818cf8; --accent-fg:#0b1020; --accent-text:#a5b4fc; --g1:#312e81; --g2:#5b21b6; --g3:#0369a1; } }
:root[data-theme="dark"]{ --btn-bg:#e2e8f0; --btn-bg-hover:#ffffff; --btn-fg:#0f172a; --accent:#818cf8; --accent-fg:#0b1020; --accent-text:#a5b4fc; --g1:#312e81; --g2:#5b21b6; --g3:#0369a1; }
:root{ --btn-bg:#1e293b; --btn-bg-hover:#0f172a; --btn-fg:#ffffff; --r-lg:16px; --r-md:12px; --shadow:0 1px 2px rgba(16,24,38,.05), 0 4px 14px rgba(16,24,38,.05); --shadow-hover:0 2px 4px rgba(16,24,38,.06), 0 10px 26px rgba(16,24,38,.10); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);} }
:root[data-theme="dark"]{ --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45); }
body{
  background:var(--bg); color:var(--fg); font-family:var(--disp); margin:0;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:20; background:var(--panel); }
h1,h2,h3{font-family:var(--disp); text-wrap:balance; margin:0}
.app{max-width:1240px; margin:0 auto; padding-bottom:56px}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  margin:12px 0 0; padding:20px 22px; display:flex; align-items:center; gap:16px; overflow:hidden;
  color:#fff; border-radius:20px; box-shadow:0 10px 30px -8px rgba(79,70,229,.45);
  background:
    radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.22), transparent 55%),
    linear-gradient(120deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 120%);
}
.brand-mark{
  width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff;
  backdrop-filter:blur(6px);
}
.brand-mark svg{width:26px; height:26px}
.brand-text{min-width:0; flex:1}
.topbar h1{font-size:1.3rem; font-weight:700; letter-spacing:-.01em; line-height:1.25; color:#fff}
.topbar .sub{display:flex; gap:8px; align-items:center; margin-top:6px}
.chip{font-family:var(--mono); font-size:.7rem; padding:2px 10px; border-radius:20px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff}
.icon-btn{
  width:42px; height:42px; flex:none; border-radius:12px; cursor:pointer; display:grid; place-items:center;
  border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.18); color:#fff;
  backdrop-filter:blur(6px); transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.3)}
.icon-btn:focus-visible{outline:2px solid #fff; outline-offset:2px}
.icon-btn svg{width:20px; height:20px}
.icon-btn .i-sun{display:none}
:root[data-eff="dark"] .icon-btn .i-sun{display:block}
:root[data-eff="dark"] .icon-btn .i-moon{display:none}

/* ---------- tab unit ---------- */
.tabs-wrap{margin-top:18px}
.tabs{
  display:flex; gap:6px; padding:5px; overflow-x:auto; scrollbar-width:thin;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-md);
}
.tab{
  flex:none; font-family:var(--disp); font-size:.84rem; font-weight:600; cursor:pointer;
  padding:9px 16px; border-radius:9px; border:0; background:transparent; color:var(--fg-dim);
  white-space:nowrap; transition:background .15s, color .15s;
}
.tab:hover{background:var(--panel-2); color:var(--fg)}
.tab[aria-selected="true"]{background:linear-gradient(120deg,var(--g1),var(--g2)); color:#fff; box-shadow:0 4px 12px -4px rgba(79,70,229,.6)}
.tab[aria-disabled="true"]{cursor:not-allowed; opacity:.55}
.tab[aria-disabled="true"]:hover{background:transparent; color:var(--fg-dim)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.tip{
  position:fixed; z-index:50; pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity .12s, transform .12s;
  background:var(--fg); color:var(--bg); font-size:.74rem; font-weight:600; padding:6px 10px; border-radius:8px;
  white-space:nowrap;
}
.tip.show{opacity:1; transform:none}

/* ---------- toolbar ---------- */
.section-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:22px 2px 0}
.section-head h2{font-size:1.02rem; font-weight:700}
.section-head .count{font-size:.76rem; color:var(--fg-dim)}
.section-head .spacer{flex:1}
.search-wrap{position:relative; flex:0 1 360px; min-width:200px; width:100%; max-width:360px}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--fg-dim); pointer-events:none}
.search{
  width:100%; font-family:var(--disp); font-size:.86rem; padding:10px 12px 10px 36px;
  border:1px solid var(--border); border-radius:var(--r-md); background:var(--panel); color:var(--fg);
}
.search:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.status-legend{display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:.72rem; color:var(--fg-dim); padding:12px 2px 0}
.status-legend .sw{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:0}

/* ---------- kartu ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px;
  padding:16px 0 4px;
}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px;
  display:flex; flex-direction:column; gap:10px; color:inherit; box-shadow:var(--shadow);
  transition:box-shadow .15s, transform .12s, border-color .15s;
}
.card.done:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px)}
.card.pending{opacity:.55; box-shadow:none; background:var(--panel-2)}
.card.st-normal{border-color:var(--false)}
.card.st-trip{border-color:var(--true)}
.sheet-no{font-family:var(--mono); font-size:.68rem; color:var(--fg-dim); letter-spacing:.05em; text-transform:uppercase}
.card-tag{font-family:var(--mono); font-size:1rem; font-weight:650; line-height:1.3}
.card-note{font-size:.76rem; color:var(--fg-dim)}
.card-state{
  align-self:flex-start; display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:.66rem;
  font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:20px;
  background:var(--panel-2); color:var(--fg-dim);
}
.stat-shape{width:8px; height:8px; border-radius:50%; background:var(--neutral-fg); flex:none}
.card.st-normal .card-state{background:var(--false-bg); color:var(--false)}
.card.st-normal .stat-shape{background:var(--false)}
.card.st-trip .card-state{background:var(--true-bg); color:var(--true)}
.card.st-trip .stat-shape{background:var(--true)}
.card-actions{display:flex; gap:8px; margin-top:auto; padding-top:4px; flex-wrap:wrap}
.card-action-btn{
  flex:1 1 auto; text-align:center; font-size:.76rem; font-weight:650; text-decoration:none;
  color:var(--btn-fg); background:var(--btn-bg); border:1px solid var(--btn-bg); border-radius:10px;
  padding:8px 10px; white-space:nowrap; transition:opacity .15s;
}
.card-action-btn.secondary{color:var(--fg); background:var(--panel-2); border-color:var(--border)}
.card-action-btn:hover{opacity:.88}
.card-action-btn:not(.secondary):hover{background:var(--btn-bg-hover); border-color:var(--btn-bg-hover); opacity:1}
.card-action-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.empty{padding:48px 4px; text-align:center; color:var(--fg-dim); font-size:.88rem}
@media (max-width:560px){
  .topbar{padding:14px; gap:10px}
  .topbar h1{font-size:1rem}
  .brand-mark{width:38px; height:38px}
}
</style>

<script>
/* ======================= sim-engine.js (inline) ======================= */
/*
  SIS Logic Sim Engine — generic, reusable untuk semua halaman (105-UC-009, dst).
  Tidak ada dependency eksternal. Dipakai di browser maupun Node.

  Netlist schema:
  {
    id, title, sheetRef,
    nodes: {
      "<nodeId>": {
        type: "INPUT" | "AND" | "OR" | "NOT" | "BUFFER" | "MOVE" | "RS" | "VOTING"
              | "TOF" | "FEEDBACK" | "NUMBITS" | "GT" | "R_TRIG" | "OUTPUT",
        label, desc, gateId,
        // AND/OR/VOTING:
        inputs: ["<nodeId>", ...],
        invertInputs: [true, false, ...]  // opsional, HANYA AND/OR: lingkaran
                      // inversi yang digambar MELEKAT di pin input tertentu
                      // (lihat Koreksi #24). Indeks sejajar `inputs`; pin yang
                      // tidak disebut dianggap tidak di-invert.
        k: <number>  // hanya VOTING, threshold jumlah input FALSE sebelum
                      // output ikut jatuh ke FALSE (lihat case "VOTING" di
                      // step() — bukan threshold "k dari n TRUE")
        // RS:
        s: "<nodeId>", r: "<nodeId>"
        // NOT/BUFFER/MOVE ("MOVE" dipakai saat gambar asli literal memberi
        // nama block itu "MOVE", bukan "BUFFER" — behaviornya identik
        // (passthrough nilai apa adanya), bedanya cuma label yang tampil
        // di kanvas supaya cocok dengan gambar sumber):
        input: "<nodeId>"
        // TOF (block vendor "T_OFF_SP") — off-delay timer waktu NYATA:
        input: "<nodeId>", setpointSec: <number>
        // FEEDBACK — nilai node lain dari SCAN SEBELUMNYA, dipakai memutus
        // loop umpan-balik yang di PLC asli sah krn semantik scan cycle:
        input: "<nodeId>"
        // OUTPUT:
        source: "<nodeId>"
      }
    },
    notes: [...]
  }
*/
(function (global) {
  function topoOrder(nodes) {
    const deps = {};
    for (const id in nodes) {
      const n = nodes[id];
      let refs = [];
      switch (n.type) {
        case "AND": case "OR": refs = n.inputs || []; break;
        case "NUMBITS": refs = n.inputs || []; break;
        /* VOTING: pin FLT hanya penanda tampilan (Koreksi #25), tapi tetap
           dihitung sbg dependensi supaya urutan evaluasi konsisten */
        case "VOTING": refs = (n.inputs || []).concat(n.fltInputs || []); break;
        case "RS": refs = [n.s, n.r]; break;
        case "NOT": case "BUFFER": case "MOVE": case "TOF": case "GT": case "R_TRIG": refs = [n.input]; break;
        case "OUTPUT": refs = [n.source]; break;
        /* FEEDBACK sengaja TIDAK punya dependensi: dia membaca nilai scan
           SEBELUMNYA, jadi justru dialah yang memutus loop umpan-balik
           supaya urutan topological tetap bisa dihitung. */
        case "FEEDBACK": refs = []; break;
        case "INPUT": refs = []; break;
      }
      deps[id] = refs;
    }
    const visited = {}, temp = {}, order = [];
    function visit(id) {
      if (visited[id]) return;
      if (temp[id]) throw new Error("Algebraic loop terdeteksi melibatkan node: " + id);
      temp[id] = true;
      (deps[id] || []).forEach(visit);
      temp[id] = false;
      visited[id] = true;
      order.push(id);
    }
    Object.keys(nodes).forEach(visit);
    return order;
  }

  function createSim(netlist) {
    const nodes = netlist.nodes;
    const order = topoOrder(nodes);
    // state: nilai boolean saat ini per node, plus memory khusus utk RS
    // (Q_prev, satu-satunya memory yg dibutuhkan formula IEC 61131-3 RS.ST)
    /* tofSince[id] = timestamp (ms) saat input TOF mulai FALSE, null kalau
       input masih TRUE. prevValues = snapshot nilai scan sebelumnya, dibaca
       node FEEDBACK. */
    const state = { values: {}, rsPrev: {}, tofSince: {}, tofArmed: {}, prevValues: {}, rtPrev: {}, rtUntil: {}, rtSeen: {} };
    for (const id in nodes) {
      state.values[id] = false;
      state.prevValues[id] = false;
      if (nodes[id].type === "RS") { state.rsPrev[id] = false; }
      /* tofArmed = timer pernah aktif (input pernah TRUE) -> hanya setelah itu
         dia menahan output saat input jatuh. Tanpa penanda ini, timer akan
         seolah menahan sejak halaman dibuka padahal inputnya belum pernah
         TRUE (bug yang sempat terjadi saat TOF pertama dipasang). */
      if (nodes[id].type === "TOF") { state.tofSince[id] = null; state.tofArmed[id] = false; }
      if (nodes[id].type === "R_TRIG") { state.rtPrev[id] = false; state.rtUntil[id] = 0; state.rtSeen[id] = false; }
    }

    /* sisa hitung mundur tiap TOF (detik, 0 kalau tidak sedang menghitung) —
       dipakai halaman utk menampilkan angka & memutuskan perlu tick lagi */
    function tofRemaining(id, now) {
      const n = nodes[id];
      if (!n || n.type !== "TOF") return 0;
      if (!state.tofArmed[id]) return 0;
      const since = state.tofSince[id];
      if (since == null) return 0;
      const left = (n.setpointSec || 0) - (now - since) / 1000;
      return left > 0 ? left : 0;
    }
    function anyTimerRunning(now) {
      const t = now == null ? Date.now() : now;
      return Object.keys(state.tofSince).some(function (id) { return tofRemaining(id, t) > 0; }) ||
             Object.keys(state.rtUntil).some(function (id) { return state.rtUntil[id] > t; });
    }
    /* Percepat timer (alat uji): semua TOF yang sedang menghitung dianggap
       sudah habis. Dipakai tombol "Lewati timer" utk setelan panjang (30 mnt). */
    function skipTimers(now) {
      const t = now == null ? Date.now() : now;
      Object.keys(state.tofSince).forEach(function (id) {
        if (state.tofSince[id] != null) state.tofSince[id] = t - ((nodes[id].setpointSec || 0) * 1000) - 1;
      });
    }

    function step(inputOverrides, nowMs) {
      const now = nowMs == null ? Date.now() : nowMs;
      // inputOverrides: { nodeId: boolean, ... } untuk semua node bertipe INPUT
      const v = state.values;
      const prev = state.prevValues;
      for (const id of order) {
        const n = nodes[id];
        switch (n.type) {
          case "INPUT":
            v[id] = !!inputOverrides[id];
            break;
          /* `invertInputs` = lingkaran inversi yang MELEKAT di pin input
             tertentu pada gambar vendor (Koreksi #24). Dibaca inline di sini,
             BUKAN lewat node NOT perantara, supaya struktur netlist & render
             cocok persis dgn gambar — pola yang sama dipakai utk bulatan di
             pin R1 block RS. */
          case "AND":
            v[id] = n.inputs.every((i, k) => (n.invertInputs && n.invertInputs[k]) ? !v[i] : !!v[i]);
            break;
          case "OR":
            v[id] = n.inputs.some((i, k) => (n.invertInputs && n.invertInputs[k]) ? !v[i] : !!v[i]);
            break;
          case "NOT":
            v[id] = !v[n.input];
            break;
          case "BUFFER": case "MOVE":
            v[id] = v[n.input];
            break;
          case "NUMBITS":
            /* NUMBITS: jumlah input yang TRUE (nilai numerik, truthy kalau >0) */
            v[id] = n.inputs.reduce((acc, i) => acc + (v[i] ? 1 : 0), 0);
            break;
          case "GT":
            /* GT: IN1 > IN2, IN2 = konstanta yang digambar di pin bawah */
            v[id] = (Number(v[n.input]) || 0) > (n.constant || 0);
            break;
          case "R_TRIG": {
            /* Deteksi tepi naik. IEC: Q TRUE hanya satu scan. Atas pilihan user
               (Koreksi #25) pulsa ditahan `pulseMs` (default 1000 ms) waktu
               nyata supaya terlihat. Scan pertama hanya merekam nilai awal
               (tidak ada pulsa palsu saat halaman dibuka dgn CLK sudah TRUE). */
            const clk = !!v[n.input];
            if (!state.rtSeen[id]) { state.rtSeen[id] = true; }
            else if (clk && !state.rtPrev[id]) { state.rtUntil[id] = now + (n.pulseMs || 1000); }
            state.rtPrev[id] = clk;
            v[id] = now < state.rtUntil[id];
            break;
          }
          case "VOTING": {
            // Voting k-of-n bertipe "sehat jika kompak" (dikonfirmasi user,
            // BUKAN "trip jika k dari n TRUE" seperti versi awal):
            // input normal/sehat = TRUE; output jadi FALSE begitu jumlah
            // input yang FALSE mencapai k (mis. 2oo9 -> output FALSE kalau
            // >=2 dari 9 input FALSE). Jadi output = (jumlah FALSE < k).
            const countFalse = n.inputs.reduce((acc, i) => acc + (v[i] ? 0 : 1), 0);
            v[id] = countFalse < n.k;
            break;
          }
          case "RS": {
            // Bistable Reset Dominant, PERSIS formula resmi IEC 61131-3
            // "RS.ST" (dikonfirmasi user lewat source function block asli):
            //   Q1 := (Q1 OR S) AND NOT R1
            // Murni kombinasional per step dgn feedback Q1 sebelumnya — TIDAK
            // ada deteksi rising-edge/pulsa khusus (versi lama keliru menambah
            // ini, lihat ARSITEKTUR.md Koreksi #9).
            // Pemetaan field netlist (lihat Koreksi #6): 's' = sinyal
            // sehat/health (dominant-clear) SETELAH inversi; 'r' = S_vendor
            // mentah (tag reset manual, vendor menyebutnya "Set" krn
            // menyetel Q1 TRUE, meski secara SIS itu tombol reset).
            // Koreksi (2026-10-24, #10): inversi R1 SEKARANG dibaca inline
            // lewat flag `sInvert` (bukan node NOT eksplisit terpisah lagi)
            // supaya netlist & render cocok dgn gambar sumber — di gambar,
            // lingkaran inversi itu MELEKAT di pin R1 block RS itu sendiri,
            // bukan gerbang NOT berdiri sendiri sebelum RS. Kalau gerbang
            // kondisi yg masuk `s` sudah "pre-corrected" jadi polaritas
            // sehat=TRUE (kasus and009_corrected/and018_corrected, lihat
            // Koreksi #6 bagian (b)), `sInvert` dibiarkan false/absen.
            const sRaw = v[n.s];
            const s = n.sInvert ? !sRaw : sRaw;
            const r = v[n.r];
            const qPrev = state.rsPrev[id];
            const next = s && (qPrev || r);
            v[id] = next;
            state.rsPrev[id] = next;
            break;
          }
          case "TOF": {
            /* Off-delay timer waktu NYATA (block vendor "T_OFF_SP"):
               input TRUE  -> output langsung TRUE & hitungan direset;
               input FALSE -> output TETAP TRUE selama `setpointSec` detik,
               baru kemudian jatuh FALSE. Karena berbasis jam dinding, halaman
               harus memanggil step() lagi secara berkala selama hitungan
               berjalan (lihat anyTimerRunning / tofRemaining). */
            const inVal = !!v[n.input];
            if (inVal) {
              state.tofSince[id] = null;
              state.tofArmed[id] = true;
              v[id] = true;
            } else if (!state.tofArmed[id]) {
              v[id] = false; // input belum pernah TRUE -> tidak ada yang ditahan
            } else {
              if (state.tofSince[id] == null) state.tofSince[id] = now;
              v[id] = ((now - state.tofSince[id]) / 1000) < (n.setpointSec || 0);
              if (!v[id]) state.tofArmed[id] = false; // hitungan habis
            }
            break;
          }
          case "FEEDBACK":
            v[id] = !!prev[n.input];
            break;
          case "OUTPUT":
            v[id] = v[n.source];
            break;
          default:
            throw new Error("Tipe node tidak dikenal: " + n.type + " (" + id + ")");
        }
      }
      /* snapshot utk node FEEDBACK di scan berikutnya (semantik scan cycle
         PLC: umpan-balik selalu memakai nilai scan sebelumnya) */
      for (const id in v) prev[id] = v[id];
      return v;
    }

    function reset() {
      for (const id in nodes) {
        state.values[id] = false;
        state.prevValues[id] = false;
        if (nodes[id].type === "RS") { state.rsPrev[id] = false; }
        if (nodes[id].type === "TOF") { state.tofSince[id] = null; state.tofArmed[id] = false; }
        if (nodes[id].type === "R_TRIG") { state.rtPrev[id] = false; state.rtUntil[id] = 0; state.rtSeen[id] = false; }
      }
    }

    return { nodes, order, state, step, reset, tofRemaining, anyTimerRunning, skipTimers };
  }

  global.SimEngine = { createSim, topoOrder };
})(typeof window !== "undefined" ? window : globalThis);

/* ======================= hubungan antar sheet (effect <-> cause) =======================
   Tag yang sama memayungi beberapa sheet (lihat _tagsync.js & data/tags.json).
   Build (`scripts/build.js`, applyTagRegistry) menandai tiap node dengan:
     - INPUT  .linkedFrom : sheet yang MENGHASILKAN tag ini (di sana dia effect)
     - INPUT  .alsoIn     : sheet lain yang memakai tag ini sbg cause juga
     - OUTPUT .linkedTo   : sheet yang MEMAKAI tag ini sbg cause/initiator
   Modul ini mengubah penanda itu jadi daftar keterangan + link navigasi,
   dipakai halaman Logic Detail (dirender sbg <a> di dalam SVG) maupun
   Cause & Effect (dirender sbg <a> di sel tabel). `useCe` menentukan link
   menuju versi Cause & Effect atau versi Logic Detail sheet tujuan —
   supaya operator tetap berada di mode tampilan yang sama saat berpindah. */
var CrossLink = (function(){
  function resolve(slugs, idx, useCe){
    return (slugs || []).map(function(s){
      var m = idx && idx[s];
      if(!m) return null;
      return {
        label: 'Sheet ' + String(m.no).padStart(3, '0'),
        tag: m.tag,
        href: useCe ? m.ceUrl : m.url
      };
    }).filter(Boolean);
  }
  return {
    /* -> [{ kind, prefix, label, title, href }] (kosong kalau tag ini tidak
       punya hubungan lintas sheet) */
    linksFor: function(node, nav, useCe){
      if(!node) return [];
      var idx = nav && nav.sheetIndex;
      var out = [];
      resolve(node.linkedFrom, idx, useCe).forEach(function(x){
        out.push({ kind: 'from', prefix: '← Sumber ', label: x.label, href: x.href,
                   title: 'Nilai tag ini dihasilkan di ' + x.label + ' (' + x.tag + ') — klik untuk membukanya' });
      });
      resolve(node.linkedTo, idx, useCe).forEach(function(x){
        out.push({ kind: 'to', prefix: '→ Menuju ', label: x.label, href: x.href,
                   title: 'Tag ini jadi cause/initiator di ' + x.label + ' (' + x.tag + ') — klik untuk membukanya' });
      });
      resolve(node.alsoIn, idx, useCe).forEach(function(x){
        out.push({ kind: 'also', prefix: '↔ Juga di ', label: x.label, href: x.href,
                   title: 'Tag yang sama juga dipakai sbg cause di ' + x.label + ' (' + x.tag + ') — status keduanya selalu sama' });
      });
      return out;
    }
  };
})();

/* ======================= status normal/trip satu sheet =======================
   Dipakai halaman portal (warna kartu tiap sheet) & halaman Cause & Effect
   (warna shape blok logic di kolom tengah). Konvensi SAMA dgn kolom EFFECT
   halaman CE (Koreksi #7): nilai TRUE = normal = hijau, FALSE = trip = merah,
   seragam utk semua OUTPUT tanpa pengecualian per tipe node.
   Satu sheet disebut NORMAL kalau SEMUA output-nya TRUE; kalau ada satu saja
   yang FALSE -> TRIP (fail-safe: tampilkan kondisi terburuk). */
var SheetStatus = (function(){
  return {
    /* values = hasil sim.step(); nodes = netlist.nodes */
    of: function(nodes, values){
      var total = 0, tripped = 0;
      Object.keys(nodes).forEach(function(id){
        if(nodes[id].type !== 'OUTPUT') return;
        total++;
        if(!values[id]) tripped++;
      });
      if(!total) return { state: 'none', total: 0, tripped: 0 };
      return { state: tripped ? 'trip' : 'normal', total: total, tripped: tripped };
    }
  };
})();

/* ======================= tab unit ======================= */
const UNITS = [
  {id:'105', label:'Unit 105', active:true}, {id:'106', label:'Unit 106'}, {id:'107', label:'Unit 107'},
  {id:'108', label:'Unit 108'}, {id:'148', label:'Unit 148'}, {id:'47', label:'Unit 47'},
  {id:'120', label:'Unit 120'}, {id:'140', label:'Unit 140'}, {id:'180', label:'Unit 180'},
  {id:'100', label:'Unit 100'}, {id:'166', label:'Unit 166'}
];
(function(){
  const tabs = document.getElementById('unitTabs');
  const tip = document.getElementById('tip');
  UNITS.forEach(function(u){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = u.label;
    b.setAttribute('aria-selected', u.active ? 'true' : 'false');
    if(!u.active){
      b.setAttribute('aria-disabled', 'true');
      b.setAttribute('aria-label', u.label + ' — Coming Soon');
      const show = function(){
        tip.textContent = 'Coming Soon';
        const r = b.getBoundingClientRect();
        tip.classList.add('show');
        tip.style.left = Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2) + 'px';
        tip.style.top = (r.bottom + 8) + 'px';
      };
      const hide = function(){ tip.classList.remove('show'); };
      b.addEventListener('mouseenter', show); b.addEventListener('mouseleave', hide);
      b.addEventListener('focus', show); b.addEventListener('blur', hide);
      b.addEventListener('click', function(e){ e.preventDefault(); show(); });
      tabs.addEventListener('scroll', hide, {passive:true});
    }
    tabs.appendChild(b);
  });
})();

/* ======================= theme toggle (ikon matahari/bulan) ======================= */
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('themeBtn');
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effective(){
    const t = root.getAttribute('data-theme');
    if(t === 'dark' || t === 'light') return t;
    return (mq && mq.matches) ? 'dark' : 'light';
  }
  function paint(){ root.setAttribute('data-eff', effective()); }
  let saved = '';
  try{ saved = localStorage.getItem('sis-portal-theme') || ''; }catch(e){}
  if(saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  paint();
  if(mq && mq.addEventListener) mq.addEventListener('change', paint);
  btn.addEventListener('click', function(){
    const next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('sis-portal-theme', next); }catch(e){}
    paint();
  });
})();

/* ======================= render grid ======================= */
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('emptyMsg');
const searchBox = document.getElementById('searchBox');

function matches(item, q){
  if(!q) return true;
  const hay = (String(item.sheet) + ' ' + item.tag + ' ' + (item.note || '')).toLowerCase();
  return hay.indexOf(q.toLowerCase()) !== -1;
}

function render(){
  const q = searchBox.value.trim();
  grid.innerHTML = '';
  let shown = 0;
  DATA.sheets.forEach(function(item){
    if(!matches(item, q)) return;
    shown++;
    const isDone = item.status === 'done';
    const tag = document.createElement('div');
    tag.className = 'card ' + item.status + (isDone && liveStatus[item.slug] ? ' st-' + liveStatus[item.slug].state : '');
    const sheetLabel = 'Sheet ' + String(item.sheet).padStart(3, '0');
    tag.innerHTML =
      '<span class="sheet-no">' + sheetLabel + '</span>' +
      '<div class="card-tag">' + item.tag + '</div>' +
      (isDone ? '<div class="card-state"><span class="stat-shape"></span><span class="st-text">—</span></div>' : '') +
      (item.note ? '<div class="card-note">' + item.note + '</div>' : '') +
      (isDone ?
        '<div class="card-actions">' +
          '<a class="card-action-btn" href="' + item.url + '">Logic Detail →</a>' +
          (item.ceUrl ? '<a class="card-action-btn secondary" href="' + item.ceUrl + '">Cause &amp; Effect →</a>' : '') +
        '</div>' : '');
    if(isDone){
      const ls = liveStatus[item.slug];
      const txt = tag.querySelector('.st-text');
      if(txt) txt.textContent = !ls ? 'STATUS TIDAK TERSEDIA'
        : (ls.state === 'normal' ? 'NORMAL' : 'TRIP — ' + ls.tripped + '/' + ls.total + ' output');
    }
    grid.appendChild(tag);
  });
  emptyMsg.style.display = shown === 0 ? 'block' : 'none';
}

/* ======================= status live tiap sheet =======================
   Portal menghitung ULANG status tiap sheet memakai engine & netlist yang
   sama dgn halaman sheet-nya (netlist ringkas disuntikkan build.js), dari
   state simulasi yang tersimpan: nilai INPUT dari store tag global lintas
   sheet (localStorage 'sis-sim-tags', lihat _tagsync.js) dan memori latch
   RS per sheet (localStorage 'sis-sim-state-<id>'). Jadi angka di sini
   selalu cocok dgn yang tampil di halaman sheet, tanpa menyimpan status
   terpisah yang bisa basi. Berubah otomatis saat tab lain mengubah state. */
const liveStatus = {};
function computeStatus(){
  let tagStore = {};
  try{ tagStore = JSON.parse(localStorage.getItem(TagSync.KEY) || '{}') || {}; }catch(e){}
  Object.keys(NETLISTS).forEach(function(slug){
    const nl = NETLISTS[slug];
    try{
      const sim = SimEngine.createSim(nl);
      const inputState = {};
      Object.keys(nl.nodes).forEach(function(id){
        const n = nl.nodes[id];
        if(n.type !== 'INPUT') return;
        const entry = n.label && tagStore[n.label];
        inputState[id] = entry ? !!entry.v : false;
      });
      try{
        const raw = localStorage.getItem('sis-sim-state-' + (nl.id || slug));
        if(raw){
          const saved = JSON.parse(raw);
          if(saved && saved.rsPrev){
            Object.keys(saved.rsPrev).forEach(function(id){
              if(id in sim.state.rsPrev) sim.state.rsPrev[id] = !!saved.rsPrev[id];
            });
          }
        }
      }catch(e){}
      liveStatus[slug] = SheetStatus.of(nl.nodes, sim.step(inputState));
    }catch(e){ delete liveStatus[slug]; }
  });
}
function syncStatusHint(){
  const nTrip = Object.keys(liveStatus).filter(function(k){ return liveStatus[k].state === 'trip'; }).length;
  const nOk = Object.keys(liveStatus).length - nTrip;
  document.getElementById('statusHint').textContent =
    'Status dihitung ulang di halaman ini dari simulasi yang tersimpan di browser — ' +
    (nTrip ? nTrip + ' sheet sedang trip, ' + nOk + ' normal.' : 'semua sheet selesai dalam kondisi normal.');
}
function refreshStatus(){ computeStatus(); syncStatusHint(); render(); }
window.addEventListener('storage', function(e){
  if(e.key === TagSync.KEY || String(e.key || '').indexOf('sis-sim-state-') === 0) refreshStatus();
});

searchBox.addEventListener('input', render);

document.getElementById('unitCount').textContent = DATA.sheets.length + ' sheet';

computeStatus();
syncStatusHint();
render();
</script>
